<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocks Paper</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:24px;background:#f8f8f2;color:#202822;font:16px/1.6 system-ui,sans-serif;min-width:280px}
