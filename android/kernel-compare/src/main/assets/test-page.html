<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>刷新率对照 / Frame pacing</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#14251c;font:16px/1.5 sans-serif}
header{position:sticky;top:0;z-index:1;background:#fff;border-bottom:1px solid #ccc;padding:10px 14px}
h1{font-size:18px;margin:0 0 5px}#stats{font:700 18px/1.5 monospace}#note,#device{font-size:12px;color:#555}
.track{height:28px;background:#edf3ee;overflow:hidden;margin:8px 0}.ball{height:24px;width:24px;background:#35614b;border-radius:50%;will-change:transform}
button{font-size:15px;min-height:40px;padding:5px 12px;margin-right:6px}section{height:150px;padding:18px;border-bottom:1px solid #ddd}
section:nth-child(even){background:#f2f6f3}section strong{font-size:22px}#ua{font-size:11px;overflow-wrap:anywhere;padding:12px}
</style></head><body>
<header><h1 id="heading"></h1><div id="stats">rAF FPS — · P95 — ms</div><div class="track"><div class="ball" id="ball"></div></div>
<button id="auto" type="button"></button><button id="reset" type="button"></button>
<div id="note"></div><div id="device"></div></header><main id="rows"></main><div id="ua"></div>
<script>
/* FRAME_METER_SOURCE */
// 页面、运动速度和采样频率完全共用；每秒才更新一次数值，避免额外逐帧文本重排。
const zh = navigator.language.toLowerCase().startsWith('zh');
const label = zh ? {title:'刷新率对照',start:'自动滚动',stop:'停止滚动',reset:'重新计数',note:'rAF 估算 ≠ 实际合成帧；请同时比较手动滚动。',row:'滚动测试',body:'同一页面、同一动画、同一速度。'} :
 {title:'Frame pacing comparison',start:'Auto scroll',stop:'Stop scrolling',reset:'Reset meter',note:'rAF estimate is not presented FPS. Also compare manual scrolling.',row:'Scroll test',body:'Same page, animation and speed.'};
document.documentElement.lang=zh?'zh-CN':'en';document.getElementById('heading').textContent=label.title;
const stats=document.getElementById('stats'),ball=document.getElementById('ball'),auto=document.getElementById('auto');
auto.textContent=label.start;document.getElementById('reset').textContent=label.reset;
document.getElementById('note').textContent=label.note;
// 宿主可能在首次布局前加载 data 页面，几何信息在布局或采样后更新。
function updateDevice(){const text=innerWidth>0&&innerHeight>0?'CSS '+innerWidth+' × '+innerHeight+' · DPR '+devicePixelRatio:'';const device=document.getElementById('device');if(device.textContent!==text)device.textContent=text;}
window.addEventListener('resize',updateDevice);updateDevice();
document.getElementById('ua').textContent=navigator.userAgent;
for(let i=1;i<=35;i++){const row=document.createElement('section');const title=document.createElement('strong');title.textContent=label.row+' '+i;const text=document.createElement('p');text.textContent=label.body;row.append(title,text);document.getElementById('rows').append(row);}
const meter=new RocksFrameMeter();let previous=null,scrolling=false;
auto.addEventListener('click',()=>{scrolling=!scrolling;auto.textContent=scrolling?label.stop:label.start;});
document.getElementById('reset').addEventListener('click',()=>{meter.reset();stats.textContent='rAF FPS — · P95 — ms';});
document.addEventListener('visibilitychange',()=>{meter.reset();previous=null;});
function frame(now){
 const delta=previous===null?0:Math.min(now-previous,100);previous=now;
 const width=ball.parentElement.clientWidth-24;ball.style.transform='translateX('+(((now%2000)/2000)*Math.max(0,width))+'px)';
 if(scrolling&&delta>0){const max=document.documentElement.scrollHeight-innerHeight;window.scrollTo(0,scrollY>=max-1?0:Math.min(max,scrollY+600*delta/1000));}
 const result=meter.push(now);if(result){stats.textContent='rAF FPS '+result.fps.toFixed(1)+' · P95 '+result.p95.toFixed(1)+' ms';updateDevice();}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
