name: Gecko extension demo
on:
  push:
    branches: ['main']
    paths: ['android/gecko-demo/**', 'android/app/src/**', 'android/development-signing.sha256', 'core/**', 'shared/**', 'scripts/**', 'settings.gradle.kts', '.github/workflows/gecko-demo.yml']
  pull_request:
    branches: ['main']
    paths: ['android/gecko-demo/**', 'android/app/src/**', 'android/development-signing.sha256', 'core/**', 'shared/**', 'scripts/**', 'settings.gradle.kts', '.github/workflows/gecko-demo.yml']
  workflow_dispatch:
    inputs:
      build_emulator_apk:
        description: '另外构建 x86_64 模拟器验证包（不下载系统镜像，不公开发布）'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Check preinstalled SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-37.0" || test -d "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
      - name: Prepare fixed development signing if configured
        id: signing
        if: github.event_name != 'pull_request'
        env:
          ROCKS_ANDROID_SIGNING: ${{ secrets.ROCKS_ANDROID_SIGNING }}
        run: python3 scripts/android_signing.py prepare
      - name: Extension script tests
        run: node --test scripts/test-gecko-extension.mjs
      - name: Portable data, persistence and browser policy tests
        run: gradle -p android/gecko-demo :core:test testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle -p android/gecko-demo lintDebug --stacktrace
      - name: Assemble APK
        run: gradle -p android/gecko-demo assembleDebug assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocks-gecko-reports
          path: |
            core/build/reports/tests/
            android/gecko-demo/build/reports/
      - name: Verify fixed signing when configured
        if: steps.signing.outputs.configured == 'true'
        run: python3 scripts/android_signing.py verify --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --apk android/gecko-demo/build/outputs/apk/debug/rocks-gecko-demo-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rocks-gecko-demo-apk
          path: android/gecko-demo/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: rocks-gecko-lifecycle-test-apk
          path: android/gecko-demo/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Assemble opt-in native emulator APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_emulator_apk
        run: |
          # 只在已归档手机包后临时替换构建架构，运行时代码保持一致。
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/gecko-demo/build.gradle.kts')
          text = path.read_text()
          assert text.count('abiFilters += "arm64-v8a"') == 1
          path.write_text(text.replace('abiFilters += "arm64-v8a"', 'abiFilters += "x86_64"'))
          PY
          gradle -p android/gecko-demo assembleDebug --stacktrace
          python3 scripts/android_signing.py verify --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --apk android/gecko-demo/build/outputs/apk/debug/rocks-gecko-demo-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/gecko-demo/build/outputs/apk/debug/rocks-gecko-demo-debug.apk | grep "native-code: 'x86_64'"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.build_emulator_apk
        with:
          name: rocks-gecko-emulator-apk
          path: android/gecko-demo/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove private signing material
        if: always()
        run: |
          if [ -n "${ROCKS_ANDROID_KEYSTORE:-}" ]; then rm -f -- "$ROCKS_ANDROID_KEYSTORE"; fi
