name: Android
on:
  push:
    paths-ignore: ['docs/**', '**/*.md', 'harmony/**', 'THIRD_PARTY_NOTICES.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'harmony/**', 'THIRD_PARTY_NOTICES.md']
  workflow_dispatch:
    inputs:
      run_emulator:
        description: 'Run emulator tests (downloads SDK/system images and accepts their SDK licenses)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      signed: ${{ steps.signing.outputs.configured }}
      certificate: ${{ steps.signature.outputs.certificate_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check preinstalled SDK packages
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Prepare fixed development signing
        id: signing
        if: github.event_name != 'pull_request'
        env:
          ROCKS_ANDROID_SIGNING: ${{ secrets.ROCKS_ANDROID_SIGNING }}
        run: python3 scripts/android_signing.py prepare
      - name: Unit tests
        run: bash gradlew :core:test :android:app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: bash gradlew :android:app:lintDebug --stacktrace
      - name: Build debug and test APKs
        run: bash gradlew :android:app:assembleDebug :android:app:assembleDebugAndroidTest --stacktrace
      - name: Verify fixed APK certificates
        id: signature
        if: steps.signing.outputs.configured == 'true'
        run: python3 scripts/android_signing.py verify --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --apk android/app/build/outputs/apk/debug/app-debug.apk --apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            core/build/reports/tests/
            android/app/build/reports/
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: rocks-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured != 'true'
        with:
          name: rocks-unsigned-apk
          path: android/app/build/outputs/apk/debug/app-debug-unsigned.apk
          retention-days: 7
      - name: Remove private signing material
        if: always()
        run: |
          if [ -n "${ROCKS_ANDROID_KEYSTORE:-}" ]; then rm -f -- "$ROCKS_ANDROID_KEYSTORE"; fi
  signing-proof:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the same private development signing key on a fresh runner
        id: signing
        env:
          ROCKS_ANDROID_SIGNING: ${{ secrets.ROCKS_ANDROID_SIGNING }}
        run: python3 scripts/android_signing.py prepare
      - name: Build again on a fresh runner
        run: bash gradlew :android:app:assembleDebug --stacktrace
      - name: Verify the same certificate
        if: steps.signing.outputs.configured == 'true'
        env:
          FIRST_CERTIFICATE: ${{ needs.build.outputs.certificate }}
        run: |
          python3 scripts/android_signing.py verify --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --apk android/app/build/outputs/apk/debug/app-debug.apk
          test "$FIRST_CERTIFICATE" = "$(cat android/development-signing.sha256)"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: rocks-signing-proof-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured != 'true'
        with:
          name: rocks-unsigned-signing-proof-apk
          path: android/app/build/outputs/apk/debug/app-debug-unsigned.apk
          retention-days: 7
      - name: Remove private signing material
        if: always()
        run: |
          if [ -n "${ROCKS_ANDROID_KEYSTORE:-}" ]; then rm -f -- "$ROCKS_ANDROID_KEYSTORE"; fi
  smoke:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare fixed development signing
        env:
          ROCKS_ANDROID_SIGNING: ${{ secrets.ROCKS_ANDROID_SIGNING }}
        run: python3 scripts/android_signing.py prepare --require
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: bash gradlew :android:app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-reports
          path: android/app/build/reports/androidTests/
      - name: Remove private signing material
        if: always()
        run: |
          if [ -n "${ROCKS_ANDROID_KEYSTORE:-}" ]; then rm -f -- "$ROCKS_ANDROID_KEYSTORE"; fi
