name: Android
on:
  push:
    paths-ignore: ['docs/**', '**/*.md', 'harmony/**', 'THIRD_PARTY_NOTICES.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'harmony/**', 'THIRD_PARTY_NOTICES.md']
  workflow_dispatch:
    inputs:
      run_emulator:
        description: 'Run emulator tests (downloads SDK/system images and accepts their SDK licenses)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check preinstalled SDK packages
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Unit tests
        run: bash gradlew :core:test :android:app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: bash gradlew :android:app:lintDebug --stacktrace
      - name: Build debug and test APKs
        run: bash gradlew :android:app:assembleDebug :android:app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            core/build/reports/tests/
            android/app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: rocks-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  smoke:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: bash gradlew :android:app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-reports
          path: android/app/build/reports/androidTests/
