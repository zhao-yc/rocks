name: Publish Rocks Gecko preview APK
on:
  push:
    branches: ['build/gecko-demo-20261021']
    paths: ['.github/workflows/publish-gecko-demo.yml']
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN: '40470046352'
      SOURCE_SHA: 'b6fc7b441d9151052bd23648887d80497b85365f'
      SOURCE_ARTIFACT: '12718555621'
      ZIP_DIGEST: 'b626104d1625e50ea38d1acaa9c7112a11fb7509de7b9fbbfdcc1093a8c5ea7f'
    steps:
      - name: Verify source build and publication ancestry
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" > "$RUNNER_TEMP/source-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$GITHUB_SHA" > "$RUNNER_TEMP/publish-diff.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root / 'source-run.json').read_text())
          assert run['head_sha'] == os.environ['SOURCE_SHA'] and run['conclusion'] == 'success'
          jobs = json.loads((root / 'source-jobs.json').read_text())['jobs']
          assert any(step['name'] == 'Verify fixed signing when configured' and step['conclusion'] == 'success'
                     for job in jobs for step in job['steps']), 'CI signing was not verified'
          diff = json.loads((root / 'publish-diff.json').read_text())
          assert diff['status'] in ('ahead', 'identical')
          assert all(f['filename'] == '.github/workflows/publish-gecko-demo.yml' for f in diff['files']), 'Runtime source changed after build'
          PY
      - name: Retrieve CI-signed APK and verify artifact digest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rocks-gecko"
          cd "$RUNNER_TEMP/rocks-gecko"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > artifact.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          artifact = json.loads(Path('artifact.json').read_text())
          assert artifact['id'] == int(os.environ['SOURCE_ARTIFACT'])
          assert artifact['name'] == 'rocks-gecko-demo-apk' and not artifact['expired']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_SHA']
          assert artifact['digest'] == 'sha256:' + os.environ['ZIP_DIGEST']
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > source.zip
          printf '%s  source.zip\n' "$ZIP_DIGEST" > source.zip.sha256
          sha256sum --check --strict source.zip.sha256
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('source.zip') as z:
              assert z.testzip() is None
              apks = [name for name in z.namelist() if name.endswith('.apk')]
              assert len(apks) == 1
              Path('rocks-gecko-0.3.0.apk').write_bytes(z.read(apks[0]))
          PY
      - name: Verify fixed certificate, package and bundled extension
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rocks-gecko"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs rocks-gecko-0.3.0.apk > certs.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging rocks-gecko-0.3.0.apk > badging.txt
          python3 - <<'PY'
          import json, re, zipfile
          from pathlib import Path
          certs = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)$', Path('certs.txt').read_text(), re.M)
          assert certs == ['61fd4f1cf391cb98b53030f008aa0dd57dae4a91fac1bf3525f8db013065acaf']
          package = Path('badging.txt').read_text().splitlines()[0]
          assert "name='org.rocks.browser.geckodemo'" in package
          assert "versionCode='3'" in package and "versionName='0.3.0-gecko'" in package
          with zipfile.ZipFile('rocks-gecko-0.3.0.apk') as z:
              assert z.testzip() is None
              assert any(n.endswith('/libxul.so') for n in z.namelist())
              assert json.loads(z.read('assets/paper/manifest.json'))['browser_specific_settings']['gecko']['id'] == 'paper@rocks.demo'
              assert not any(n.lower().endswith(('.p12', '.jks', '.keystore')) for n in z.namelist())
          print(package)
          PY
          sha256sum rocks-gecko-0.3.0.apk > rocks-gecko-0.3.0.apk.sha256
      - name: Publish public preview release
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Rocks Gecko 0.3.0 沉浸式交互预览版，Android 10+ / ARM64。

          沿用 Gecko Demo 0.1 / 0.2 的包名及固定签名，可直接覆盖安装，不需要卸载，保留书签、历史和扩展设置。

          本轮变化：
          - 移除浏览器顶部标题栏，网页延伸到悬浮底栏后方，底栏伸缩不改变 GeckoView 尺寸。
          - 展开为单行悬浮操作栏，向下浏览后收起为网址胶囊；向上浏览或轻点胶囊恢复。
          - 保持 Rocks 的浅绿/深绿、细边框及圆角风格，借鉴 Safari 的交互方式。
          - 编辑网址、键盘弹出、打开面板或菜单时保持展开；轻点胶囊先展开，再点网址编辑。
          - 两种状态都可左右滑动切换标签；单次拖动最多切换相邻标签，短滑回弹，首尾不循环。
          - 扩展、前进、书签、分享、起始页与浏览记录集中到“更多”；保留下载、上传和标签恢复。
          - 使用 Gecko 合成器的用户滚动事件，过滤脚本滚动、缩放与方向抖动。TalkBack 和大字体时保持展开。

          51 项 JVM 测试、扩展脚本测试、lint、APK 编译与实际固定签名校验通过。新浮层动画、键盘、网站底部固定元素及横屏仍需真机验收。
          APK 由 CI 从仓库 Secret 自动签名，发布时再次校验证书、包名、版本和文件摘要；没有公开私钥。
          源码与验收步骤：https://github.com/zhao-yc/rocks/blob/build/gecko-demo-20261021/android/gecko-demo/README.md
          源码提交：b6fc7b441d9151052bd23648887d80497b85365f。
          NOTES
          cd "$RUNNER_TEMP/rocks-gecko"
          gh release create v0.3.0-gecko rocks-gecko-0.3.0.apk rocks-gecko-0.3.0.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Rocks Gecko 0.3.0 — Immersive Controls' --prerelease --latest=false --notes-file "$RUNNER_TEMP/release-notes.md"
